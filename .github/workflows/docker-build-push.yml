name: Build and Push All Images

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 605199373194.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: login-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::605199373194:role/github-login-app-ecr
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY/backend:${{ github.sha }} ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY/backend:${{ github.sha }}

      - name: Build and Push Frontend
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY/frontend:${{ github.sha }} ./frontend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY/frontend:${{ github.sha }}

      - name: Build and Push MySQL
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY/mysql:${{ github.sha }} ./mysql-init
          docker push $ECR_REGISTRY/$ECR_REPOSITORY/mysql:${{ github.sha }}
