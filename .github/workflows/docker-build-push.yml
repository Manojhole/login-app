name: Build and Push All Images

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 605199373194.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::605199373194:role/github-login-app-ecr
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Backend
      - name: Build Backend
        run: |
          docker build \
            -t $ECR_REGISTRY/login-app-backend:${{ github.sha }} \
            ./backend

      - name: Push Backend
        run: |
          docker push \
            $ECR_REGISTRY/login-app-backend:${{ github.sha }}

      # Frontend
      - name: Build Frontend
        run: |
          docker build \
            -t $ECR_REGISTRY/login-app-frontend:${{ github.sha }} \
            ./frontend

      - name: Push Frontend
        run: |
          docker push \
            $ECR_REGISTRY/login-app-frontend:${{ github.sha }}

      # MySQL
      - name: Build MySQL
        run: |
          docker build \
            -t $ECR_REGISTRY/login-app-mysql:${{ github.sha }} \
            ./mysql-init

      - name: Push MySQL
        run: |
          docker push \
            $ECR_REGISTRY/login-app-mysql:${{ github.sha }}
