# ============================================================
#  docker-compose.yml  —  login-app
#  Reads secrets from .env (never commit .env to git!)
# ============================================================
version: "3.9"

services:

  # ── MySQL Database ──────────────────────────────────────
  mysql_db:
    build:
      context: ./mysql-init
      dockerfile: Dockerfile
    container_name: login_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${MYSQL_DATABASE}
      MYSQL_USER:          ${MYSQL_USER}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"          # expose only for local dev/debugging
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Flask Backend ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: login_backend
    restart: unless-stopped
    environment:
      MYSQL_HOST:          ${MYSQL_HOST}
      MYSQL_PORT:          ${MYSQL_PORT}
      MYSQL_DATABASE:      ${MYSQL_DATABASE}
      MYSQL_USER:          ${MYSQL_USER}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD}
      FLASK_SECRET_KEY:    ${FLASK_SECRET_KEY}
      FLASK_ENV:           ${FLASK_ENV}
      FLASK_PORT:          ${FLASK_PORT}
      BCRYPT_LOG_ROUNDS:   ${BCRYPT_LOG_ROUNDS}
      ALLOWED_ORIGINS:     ${ALLOWED_ORIGINS}
    depends_on:
      mysql_db:
        condition: service_healthy
    ports:
      - "5000:5000"          # expose only for local dev/debugging

  # ── Nginx Frontend ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: login_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend

volumes:
  mysql_data:
    name: login_mysql_data
