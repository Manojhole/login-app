services:
  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: demo
      RABBITMQ_DEFAULT_PASS: demo_password_change_me
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  producer:
    build: ./producer
    environment:
      PORT: 3000
      AMQP_URL: amqp://demo:demo_password_change_me@rabbitmq:5672
      QUEUE_NAME: demo.jobs
    ports:
      - "3000:3000"
    depends_on:
      rabbitmq:
        condition: service_healthy

  consumer:
    build: ./consumer
    environment:
      PORT: 3001
      AMQP_URL: amqp://demo:demo_password_change_me@rabbitmq:5672
      QUEUE_NAME: demo.jobs
      PROCESSING_DELAY_MS: 60000
    ports:
      - "3001:3001"
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq_data:
